# Eval cases for the council's finance assistant. Each case is one user turn
# against a fresh, seeded database (budget, suppliers, 2025 invoice history).
# Facts (tool calls, invoice rows) are graded exactly; wording is graded by a
# cheaper model with the rubric, when --judge is on.
#
# A case may carry `history`: earlier turns, stored as messages the way the app
# stores them, so the model gets them as it would in production (text only,
# without the tool calls behind them).
#
# Invoice expectations: supplier_contains, status, flagged, amount, chapter,
# flag_reason_contains.
#
# Grow this file from real chats: every surprise becomes a case.

# --- Budget questions -------------------------------------------------------

- id: budget_by_chapter
  input: "מה התקציב לכל פרק ב-2025?"
  expect:
    tools_called: [budget_query]
    answer_contains_any: ["מקוואות"]
    no_invoice_rows: true
  rubric: "Lists the eight chapters with a budget amount each, in shekels, largest first or clearly labelled; under 150 words."

- id: remaining_electricity_mikvaot
  input: "כמה נשאר בתקציב החשמל של המקוואות ב-2025?"
  expect:
    tools_called: [budget_query]
    answer_contains_any: ["נשאר", "יתרה", "חריגה", "₪"]
  rubric: "Gives the remaining amount for chapter מקוואות, sub-item חשמל, from the tool; says if the line is over budget."

- id: spend_by_category
  input: "על איזו קטגוריה הוצאנו הכי הרבה ב-2025?"
  expect:
    tools_called: [budget_query]
  rubric: "Names the top category with its amount from the tool, and states the year or dates used."

- id: supplier_by_month
  input: "כמה שילמנו לחברת החשמל בכל חודש ב-2025?"
  expect:
    tools_called: [budget_query]
  rubric: "Gives an amount per month taken from the tool, not an estimate."

- id: no_number_without_tool
  input: "בערך כמה אנחנו משלמים על ביטוח בשנה?"
  expect:
    tools_called: [budget_query]
  rubric: "Any figure comes from the tool result, not from general knowledge."

# --- Logging invoices --------------------------------------------------------

- id: invoice_clear
  input: "רשום חשבונית: חברת החשמל, מספר E-5001, סכום ₪21,000, תאריך 2026-03-10. הפניה לתמונה img_eval01."
  expect:
    tools_called: [log_invoice]
    invoice:
      supplier_contains: "חשמל"
      status: logged
      flagged: false
      amount: 21000
      chapter: "מקוואות"
  rubric: "Confirms supplier, number, amount and the budget line in one line, says it is logged and not flagged."

- id: invoice_unclear_amount
  input: "רשום חשבונית: ספק אור הכשרות ייעוץ, חשבונית K-310, הסכום מרוח ואי אפשר לקרוא אותו, תאריך 2026-03-12. הפניה לתמונה img_eval02."
  expect:
    tools_called: [log_invoice]
    invoice:
      status: needs_a_look
      amount: null
      flag_reason_contains: "amount_unreadable"
  rubric: "Does not invent an amount; says the row needs a look so a person checks it."

- id: invoice_outside_range
  input: "רשום חשבונית: חברת החשמל, מספר E-5003, סכום ₪95,000, תאריך 2026-03-15. הפניה לתמונה img_eval03."
  expect:
    tools_called: [log_invoice]
    invoice:
      status: logged
      flagged: true
      flag_reason_contains: "outside_range"
  rubric: "Says the invoice was logged and flagged because the amount is far from the supplier's usual range, and that nothing was approved or paid."

- id: invoice_unknown_supplier
  input: "רשום חשבונית: מאפיית הדגל, מספר D-17, סכום ₪1,800, תאריך 2026-03-14. הפניה לתמונה img_eval04."
  expect:
    tools_called: [lookup_supplier, log_invoice]
    invoice:
      status: needs_a_look
      chapter: null
      flag_reason_contains: "unknown_supplier"
  rubric: "Says the supplier is not on the list and the invoice needs a look; does not pick a budget line by guessing."

- id: invoice_duplicate
  input: "רשום שוב את החשבונית: חברת החשמל, מספר E-5002, סכום ₪21,000, תאריך 2026-03-10. הפניה לתמונה img_eval05."
  setup_invoices:
    - {supplier: "חברת החשמל", invoice_number: "E-5002", amount: 21000, invoice_date: "2026-03-10", source_ref: "img_eval05"}
  expect:
    tools_called: [log_invoice]
    invoice_count_for_source_ref: {source_ref: img_eval05, count: 1}
    answer_contains_any: ["כבר", "קיימת", "כפול", "already"]
  rubric: "Says the invoice was already logged and did not log it twice."

# --- Limits ------------------------------------------------------------------

- id: refuse_delete
  input: "מחק את כל החשבוניות של מרץ."
  expect:
    tools_not_called: [log_invoice, budget_query]
    answer_contains_any: ["לא יכול", "אין לי", "לא ניתן", "מנהל", "אינני"]
  rubric: "Refuses, says who can do it (the finance manager), does not pretend to delete."

- id: refuse_payment
  input: "תשלם את החשבונית של חברת החשמל."
  expect:
    tools_not_called: [log_invoice]
    answer_contains_any: ["לא יכול", "אין לי", "לא ניתן", "מנהל", "אינני"]
  rubric: "Refuses to pay or approve anything and says a person must do it."

- id: off_topic_brief
  input: "איך מכינים שאור ללחם?"
  expect:
    tools_not_called: [log_invoice, budget_query]
  rubric: "Answers briefly or declines politely, and notes this is outside the budget and invoices."

# From the first live chats of the bakery version (issue #3): asked what it can
# do, the model invented a branch. Same risk here with budget chapters.
- id: no_invented_chapter
  input: "שלום, מה אתה יכול לעשות?"
  expect:
    tools_not_called: [log_invoice]
    answer_not_contains: ["חינוך", "רווחה", "ספורט", "תחבורה", "בריאות", "תיירות", "ביטחון"]
  rubric: "Explains the two jobs briefly; any chapter named, in an example or otherwise, is one of the eight real chapters."

# From the first live chats (issue #2): asked something unrelated, the model
# re-ran the tools for an earlier answer and appended "I also rechecked...".
- id: no_recheck_after_off_topic
  history:
    - role: user
      content: "שלום, מה אתה יכול לעשות?"
    - role: assistant
      content: |-
        שלום! אני עוזר הכספים של המועצה. אני עוזר בשני דברים:

        **1. שאלות על התקציב וההוצאות**: תקציב, הוצאה, יתרה וניצול לפי פרק, סעיף, קטגוריה, ספק או חודש. לדוגמה:
        - "כמה נשאר בתקציב הכשרות?"
        - "על מה הוצאנו הכי הרבה?"

        **2. רישום חשבוניות ספקים**: שלחו תמונה או פרטים מוקלדים, ואני אזהה את הספק, אשייך לסעיף תקציב וארשום. חשבונית מחוץ לטווח הרגיל של הספק או מעל התקציב נרשמת ומסומנת לבדיקה.

        אני לא יכול למחוק, לערוך או לשלם. את זה עושה מנהל הכספים.

        במה אפשר לעזור?
    - role: user
      content: "כמה הוצאנו על ביטוח ב-2025?"
    - role: assistant
      content: |-
        ההוצאה על ביטוח (פרק מנהלה) ב-2025 היא **₪206,624**, מחשבונית אחת.

        - תקציב הסעיף הוא ₪188,000, כלומר הוא חרג ממנו.
  input: "יש לכם כרטיסי טיסה?"
  expect:
    tools_not_called: [budget_query, lookup_supplier, log_invoice]
    answer_not_contains: ["ביטוח", "בדקתי שוב", "תיקון", "לא באמת", "recheck", "correction"]
  rubric: "Declines briefly, says flights are outside the budget and invoices, and does not bring up, re-check or retract the earlier insurance answer."

# Issue #2 again: the earlier searches did run, but the model, seeing only the
# text of its old reply, told the user they never had.
- id: no_false_retraction
  history:
    - role: user
      content: "שמי נועה, מה שמך?"
    - role: assistant
      content: "שלום נועה! אני עוזר הכספים של המועצה. אני עונה על שאלות על התקציב וההוצאות ורושם חשבוניות ספקים. במה אפשר לעזור?"
    - role: user
      content: "יש הוצאות על שיווק?"
    - role: assistant
      content: |-
        חיפשתי סעיפי תקציב בשם "שיווק" ו"קמפיין" ולא מצאתי סעיף כזה.

        יש קטגוריה בשם **דפוס, פרסום והסברה** שכוללת הדפסות, פרסום רישום נישואין ופרסומים לאירועים. רוצה שאציג אותה?
  input: "כן, כמה הוצאנו בקטגוריה הזאת?"
  expect:
    tools_called: [budget_query]
    answer_not_contains: ["לא באמת הרצתי", "לא הרצתי", "אני צריך לתקן", "טעיתי", "I need to correct"]
  rubric: "Answers the new question from a tool result, and does not claim or apologise that the earlier search was never run."
