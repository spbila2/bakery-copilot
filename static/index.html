<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>עוזר הכספים של המועצה</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
</head>
<body>
  <div id="login" class="modal hidden" role="dialog" aria-labelledby="login-title">
    <form id="login-form" class="card">
      <img class="logo-lg" src="/static/logo.svg" alt="" width="72" height="72">
      <p class="kicker">מועצה דתית</p>
      <h1 id="login-title">עוזר הכספים</h1>
      <p class="lead">שאלות על התקציב וההוצאות, ורישום חשבוניות ספקים.</p>
      <label>השם שלך<input id="login-name" name="name" autocomplete="username" required minlength="2" maxlength="40" placeholder="לדוגמה: דנה"></label>
      <label>סיסמת הצוות<input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="primary wide">כניסה</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <img class="logo" src="/static/logo.svg" alt="" width="36" height="36">
        <div><strong>עוזר הכספים</strong><small id="who"></small></div>
      </div>
      <button id="new-chat" class="primary wide">+ שיחה חדשה</button>
      <nav id="conversations" class="conversations" aria-label="שיחות"></nav>
      <div class="sidebar-foot">
        <button id="logout" class="ghost">יציאה</button>
        <span class="version" title="גרסת האתר שנטענה">גרסה {{VERSION}}</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h2 id="conv-title">שיחה חדשה</h2>
        <span id="status" class="status"></span>
        <button id="toggle-invoices" class="invoices-btn" type="button"><span aria-hidden="true">🧾</span> חשבוניות</button>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <div id="attachment" class="attachment hidden" role="status">
        <img id="attachment-thumb" alt="" width="44" height="44">
        <span id="attachment-name"></span>
        <button id="attachment-remove" type="button" aria-label="הסרת התמונה">✕</button>
      </div>

      <form id="composer" class="composer">
        <div class="attach-row">
          <label class="attach camera" title="צילום חשבונית במצלמה">
            <input id="photo" type="file" accept="image/*" capture="environment" aria-label="צילום חשבונית במצלמה">
            <span aria-hidden="true">📷</span><span class="txt">צילום</span>
          </label>
          <label class="attach" title="צירוף קובץ תמונה של חשבונית">
            <input id="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif" aria-label="צירוף קובץ תמונה של חשבונית">
            <span aria-hidden="true">📎</span><span class="txt">צירוף קובץ</span>
          </label>
        </div>
        <textarea id="input" rows="1" dir="rtl" placeholder="שאלה על התקציב, או חשבונית…"></textarea>
        <button id="send" type="submit" class="primary">שליחה</button>
      </form>
    </main>

    <aside id="invoices" class="panel hidden" aria-label="חשבוניות אחרונות">
      <header><h3>חשבוניות אחרונות</h3><button id="close-invoices" class="ghost" aria-label="סגירה">✕</button></header>
      <table>
        <thead><tr><th>תאריך</th><th>ספק וסעיף</th><th>סכום</th><th>סטטוס</th></tr></thead>
        <tbody id="invoice-rows"></tbody>
      </table>
    </aside>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
